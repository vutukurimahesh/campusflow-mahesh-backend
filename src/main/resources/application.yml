server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: campusflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusflow}
    username: ${DB_USERNAME:campusflow}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

app:
  jwt:
    # REQUIRED. No default on purpose: set JWT_SECRET (min 32 characters) per deployment.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    # Comma separated list of allowed frontend origins, e.g. https://my-frontend.onrender.com
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  timezone: ${APP_TIMEZONE:UTC}

logging:
  level:
    root: INFO
    com.campusflow: INFO
