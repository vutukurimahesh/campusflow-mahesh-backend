# Optional Render Blueprint. Fill the `sync: false` values in the Render dashboard when prompted.
services:
  - type: web
    name: campusflow-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_URL
        sync: false        # jdbc:postgresql://<internal-host>:5432/<db>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false        # https://<your-frontend>.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Kolkata
